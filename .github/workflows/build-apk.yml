name: Build Android APK
# Build trigger: requested Android debug APK

on:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "lib/**"
      - "sample/**"
      - "pubspec.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          cd sample
          flutter pub get
      - name: Build debug APK
        working-directory: sample
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sably_ARM-debug-apk
          path: sample/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
